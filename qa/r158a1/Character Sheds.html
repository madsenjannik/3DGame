<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dde5d3}#app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script></head><body><div id="app"></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const touch=matchMedia('(pointer:coarse)').matches;const r=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,touch?1.2:1.6));r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('app').appendChild(r.domElement);

[[-9,-7,1.5,1],[-6,-8,1.2,0],[-3,-8,1.1,1],[1,-9,1.2,0],[5,-9,1.25,0],[9,-8,1.35,0],[12,-5,1.45,0],[-12,-2,1.3,1],[-9,3,1.1,0],[-5,4,1.25,1],[7,4,1.2,0],[11,2,1.4,0]].forEach(v=>tree(...v));

// Claude-style garden beds

for(let x=-6.8;x<4.5;x+=.65)box(x,.75,6.3,.12,1.5,.12,whiteMat);box(-1.2,.65,6.3,12,.12,.12,whiteMat);box(-1.2,1.15,6.3,12,.12,.12,whiteMat);

const loader=new GLTFLoader(),mixers=[];let charMixer=null,hop=null;function shadows(root){root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}})}

const ch=charG.scene;shadows(ch);const bb=new THREE.Box3().setFromObject(ch),sz=bb.getSize(new THREE.Vector3());ch.scale.setScalar(1.6/Math.max(.01,sz.y));ch.position.set(5.5,.05,3.05);ch.rotation.y=-.65;s.add(ch);charMixer=new THREE.AnimationMixer(ch);const idle=charG.animations.find(a=>a.name==='Idle');if(idle)charMixer.clipAction(idle).play();const hc=charG.animations.find(a=>a.name==='Hop');if(hc){hop=charMixer.clipAction(hc);hop.setLoop(THREE.LoopOnce,1);hop.clampWhenFinished=true}mixers.push(charMixer);
