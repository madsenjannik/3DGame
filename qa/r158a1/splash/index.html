<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dde5d3;font-family:Manrope,system-ui,sans-serif}.wrap{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(40% 40% at 50% 50%,rgba(255,244,210,.26),rgba(255,244,210,0) 72%),#dde5d3}.copy{position:relative;z-index:2;font:800 clamp(22px,2.5vw,34px)/1.2 Manrope;color:#2b2a24;letter-spacing:-.025em}.dots{display:inline-flex;min-width:32px}.dots span{opacity:.16;animation:dot 1.1s infinite}.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}.leaf{position:absolute;left:110%;border-radius:0 100% 0 100%;animation:wind var(--dur) cubic-bezier(.3,.1,.5,1) var(--delay) both}.b{filter:blur(6px);opacity:.82}.spark{position:absolute;left:110%;width:4px;height:4px;border-radius:50%;background:#fff6dc;box-shadow:0 0 6px rgba(255,240,200,.9);animation:wind var(--dur) cubic-bezier(.3,.1,.5,1) var(--delay) both}@keyframes dot{0%,20%{opacity:.16}40%,100%{opacity:1}}@keyframes wind{0%{transform:translate(110vw,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(-20vw,var(--dy)) rotate(var(--rot));opacity:1}}</style></head><body><div class="wrap"><span class="leaf b" style="top:34%;width:115px;height:63px;background:#8fd14f;--dy:-5vh;--rot:812deg;--dur:1.3s;--delay:.12s"></span><span class="leaf" style="top:70%;width:25px;height:14px;background:#a6c85e;--dy:6vh;--rot:742deg;--dur:1.9s;--delay:.25s"></span><span class="leaf" style="top:22%;width:22px;height:12px;background:#5fae3a;--dy:-5vh;--rot:557deg;--dur:2.5s;--delay:.05s"></span><span class="spark" style="top:46%;--dy:8vh;--rot:0deg;--dur:1.6s;--delay:.4s"></span><span class="spark" style="top:78%;--dy:-4vh;--rot:0deg;--dur:2.2s;--delay:.2s"></span><div class="copy">The world is growing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div><script>const t=setTimeout(()=>parent.postMessage({type:'splash:done'},'*'),1550);addEventListener('message',e=>{if(e.data?.type==='splash:dispose')clearTimeout(t)});</script></body></html>
