    const seg=[];let L=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);L+=l;}
    let d=b*L,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}const u=Math.min(1,d/seg[i]),p0=pts[i],p1=pts[i+1];
    thora.g.position.set(p0[0]+(p1[0]-p0[0])*u,0,p0[1]+(p1[1]-p0[1])*u);
    const yW=Math.atan2(p1[0]-p0[0],p1[1]-p0[1]),yE=Math.atan2(cB.x-bx2,cB.z-bz2)-0.3,yS=Math.atan2(cF.x-thx,cF.z-thz)-(pod?0.25:0);
    let yT=bk<0.08?yS:bk>0.9?yE:yW;let cur=thora.g.rotation.y,df=((yT-cur+PI*3)%(PI*2))-PI;thora.g.rotation.y=bk>=1?yE:cur+df*Math.min(1,dt*12);}
  else{thora.g.position.set(thx,0,thz);thora.g.rotation.y=Math.atan2(cF.x-thx,cF.z-thz)-(pod?0.25:0);}
  const rt=t-1.25;
  if(walking){const ph=(T-WT0)*PI*5.5;thora.b.pose(T,null);thora.g.position.y=0.14*Math.abs(Math.sin(ph));thora.b.top.rotation.z=0.14*Math.sin(ph);thora.b.top.rotation.x=0.1*Math.min(1,bk*5)*(1-bk);TR.ArmL.rotation.x+=0.6*Math.sin(ph);TR.ArmR.rotation.x-=0.6*Math.sin(ph);}
  else if(P.board){thora.b.top.rotation.x=0;thora.b.pose(0,null,'Talk',T);TR.ArmL.rotation.z+=1.0;TR.ArmL.rotation.x-=0.3;}
  else if((thora.b.top.rotation.x=0)||rt<0)thora.b.pose(T,null);
  else if(P.react==='cheer'){thora.b.pose(T,rt%2.6);thora.g.position.y=0.18*Math.abs(Math.sin(rt*7.5))*(rt<1.6?1:0);}
  else if(P.react==='scold'){thora.b.pose(0,null,'Talk',T);TR.Head.rotation.y+=0.35*Math.sin(T*11)*Math.max(0,1-rt/1.4);TR.Body.rotation.x-=0.08;}
  else if(P.react==='shrug'){thora.b.pose(0,null,'Talk',T);TR.Head.rotation.z+=0.18;TR.ArmL.rotation.z+=0.3;}
  else thora.b.pose(0,null,'Talk',T);
  if(cf.count)stepConfetti(dt);
  if(P.board&&bk>=0.85&&BS.t0<0)BS.t0=T;
  const n=BS.t0<0?0:Math.min(BS.rows.length,Math.floor((T-BS.t0)/0.11));if(n!==BS.n){BS.n=n;drawBoard(n);}
  P.fx+=(P.tfx-P.fx)*Math.min(1,dt*3);P.fy+=(P.tfy-P.fy)*Math.min(1,dt*3);const w=innerWidth,h=innerHeight;camera.setViewOffset(w,h,(0.5-P.fx)*w,(0.5-P.fy)*h,w,h);
  camera.updateMatrixWorld();renderer.render(scene,camera);
  if(++fr%2===0&&parent!==window){thora.b.top.updateMatrixWorld(true);TR.Head.getWorldPosition(hp);hp.y+=0.55;hp.project(camera);
    const x=((hp.x+1)/2).toFixed(4),y=((1-hp.y)/2).toFixed(4),s=x+','+y;if(s!==lastH){lastH=s;parent.postMessage({thoraHead:{x:+x,y:+y}},'*');}}
});
