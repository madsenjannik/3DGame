name: R158A.1 isolated physical Safari preview
on:
  pull_request:
    paths:
      - 'qa/r158a1/**'
      - 'tests/qa-preview-isolation.mjs'
      - '.github/workflows/qa-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    name: QA storage isolation and real nested game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Playwright
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium and WebGL deps
        run: npx playwright install --with-deps chromium
      - name: Test nested QA runtime, isolated saves and tabs
        run: node tests/qa-preview-isolation.mjs
