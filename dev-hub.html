<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172019">
<title>THE GROWING WILDS · DEV / TEST</title>
<style>
:root{color-scheme:dark;--bg:#151b16;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.12);--ink:#f3efe3;--muted:#aab3a3;--accent:#c7d1b9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink)}body{min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(circle at 50% -10%,#3b4d37 0,#202a21 38%,#151b16 75%)}main{width:min(980px,100%);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#a9b49d}.badge{flex:none;padding:7px 10px;border:1px solid rgba(217,226,202,.22);border-radius:999px;color:#d9e2ca;background:rgba(217,226,202,.07);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,68px);line-height:.92;margin:14px 0 10px;letter-spacing:-.045em}p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}.card{position:relative;appearance:none;text-decoration:none;color:inherit;min-height:126px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;touch-action:manipulation;transition:transform .12s ease,background .12s ease,border-color .12s ease}.card:active{transform:scale(.985);background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22)}.card.normal{border-color:rgba(199,209,185,.24);background:rgba(199,209,185,.08)}.n{position:absolute;left:18px;top:16px;font-size:9px;letter-spacing:.17em;color:#87947f}.name{font-weight:760;font-size:clamp(19px,4vw,26px);letter-spacing:-.03em}.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);color:#7f8d79;font-size:10px}.back{color:var(--accent);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 4px;touch-action:manipulation}@media(min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card{min-height:160px}}@media(max-width:520px){body{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}.grid{grid-template-columns:1fr;gap:10px;margin-top:20px}.card{min-height:92px;padding:15px 16px 14px}.n{left:auto;right:16px;top:14px}.name{font-size:21px}.sub{max-width:86%}h1{font-size:42px}.foot{margin-top:14px}}
</style>
</head>
<body><main><div class="top"><div><div class="eyebrow">Internal development launcher</div><h1>THE GROWING WILDS<br>DEV / TEST</h1><p>Fast touch-first access to review areas. This UI never appears in normal gameplay.</p></div><div class="badge">DEV ONLY</div></div><div id="grid" class="grid"></div><div class="foot"><span>R40 candidate · Claude Podie / Result / Chalkboard 1:1 port</span><a class="back" href="./index.html">← Normal start</a></div></main>
<script type="module">import{DEV_BUILDS}from'./dev-builds.js';const g=document.getElementById('grid');DEV_BUILDS.forEach((b,i)=>{const a=document.createElement('a');a.className='card'+(b.kind==='normal'?' normal':'');a.href=b.href;a.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><span class="name">${b.label}</span><span class="sub">${b.sub}</span>`;g.appendChild(a);});</script></body></html>
