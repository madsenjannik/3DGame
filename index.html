<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dde5d3;font-family:Manrope,system-ui,sans-serif}button{font:inherit}
@keyframes sp-fade{from{opacity:0}to{opacity:1}}@keyframes sp-burst-in{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-drop{0%{opacity:0;transform:translateY(-140px) scale(.7) rotate(-8deg)}60%{opacity:1;transform:translateY(10px) scale(1.04) rotate(1deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes sp-pop{0%{opacity:0;transform:scale(.3) rotate(6deg)}65%{opacity:1;transform:scale(1.1) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes sp-sprout{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}@keyframes sp-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes sp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sp-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp-btn{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes sp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes sp-shine{0%,55%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}@keyframes sp-leave{to{opacity:0;transform:scale(1.08)}}
@keyframes sp-wind{0%{transform:translate(110vw,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(-20vw,var(--dy)) rotate(var(--rot));opacity:1}}
.start-screen{position:fixed;inset:0;overflow:hidden;background:#dde5d3}
.scene-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;animation:sp-fade 1s ease both}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 50% 42%,rgba(20,28,16,.28) 0%,rgba(20,28,16,0) 70%),linear-gradient(180deg,rgba(20,28,16,0) 60%,rgba(20,28,16,.35) 100%);animation:sp-fade 1.2s ease .2s both}
.wind-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}.wind-layer span{position:absolute;left:0;border-radius:0 100% 0 100%;box-shadow:0 0 0 2px rgba(43,42,36,.5);animation:sp-wind var(--dur) cubic-bezier(.3,.1,.5,1) var(--delay) both}.wind-layer i{position:absolute;left:0;width:4px;height:4px;border-radius:50%;background:#fff6dc;opacity:.8;box-shadow:0 0 6px rgba(255,240,200,.8);animation:sp-wind var(--dur) cubic-bezier(.3,.1,.5,1) var(--delay) both}
.ui{position:absolute;inset:0;z-index:6;pointer-events:none;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.logo-col{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;padding-bottom:6vh}
.logo-box{position:relative;width:540px;height:300px;flex-shrink:0;transform:scale(var(--k));transform-origin:center}
.burst-wrap{position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;animation:sp-burst-in 1s cubic-bezier(.2,.8,.2,1) .3s both}.burst{width:100%;height:100%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,236,170,.22) 0deg 9deg,rgba(255,236,170,0) 9deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%);animation:sp-spin 80s linear infinite}
.logo-bob{position:absolute;inset:0;display:grid;place-items:center;animation:sp-bob 4.5s ease-in-out 2.2s infinite}
.logo{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;transform:rotate(-5deg)}
.growing{display:block;font:400 98px/.95 'Lilita One';color:#ffd45a;text-shadow:5px 0 0 #2b2a24,-5px 0 0 #2b2a24,0 5px 0 #2b2a24,0 -5px 0 #2b2a24,3.5px 3.5px 0 #2b2a24,-3.5px 3.5px 0 #2b2a24,3.5px -3.5px 0 #2b2a24,-3.5px -3.5px 0 #2b2a24,0 9px 0 #2b2a24,0 18px 22px rgba(0,0,0,.35);animation:sp-drop .8s cubic-bezier(.3,1.3,.5,1) .5s both}
.wilds-wrap{position:relative}.sprout{position:absolute;z-index:1;transform-origin:0 100%;animation:sp-sprout .6s cubic-bezier(.3,1.6,.5,1) both}.sprout.a{left:150px;top:-26px;animation-delay:1.1s}.sprout.b{left:186px;top:-34px;animation-delay:1.22s}.sprout>span{display:block;transform-origin:0 100%;animation:sp-sway 3.2s ease-in-out 1.9s infinite}.sprout.b>span{animation:sp-sway 3.6s ease-in-out 2.1s infinite reverse}.sprout em{display:block;width:40px;height:22px;border-radius:0 100% 0 100%;background:#8fd14f;border:3px solid #2b2a24;transform:rotate(-30deg)}.sprout.b em{width:46px;height:25px;background:#5fae3a;transform:rotate(20deg)}
.wilds{display:block;font:400 118px/.95 'Lilita One';color:#8fd14f;text-shadow:5px 0 0 #2b2a24,-5px 0 0 #2b2a24,0 5px 0 #2b2a24,0 -5px 0 #2b2a24,3.5px 3.5px 0 #2b2a24,-3.5px 3.5px 0 #2b2a24,3.5px -3.5px 0 #2b2a24,-3.5px -3.5px 0 #2b2a24,0 9px 0 #2b2a24,0 18px 22px rgba(0,0,0,.35);animation:sp-pop .7s cubic-bezier(.3,1.4,.5,1) .78s both}
.actions{display:flex;flex-direction:column;gap:24px;align-items:center}.tag{font:700 13px/1 Manrope;letter-spacing:.32em;color:#fffaf0;text-shadow:0 2px 8px rgba(0,0,0,.45);animation:sp-up .7s cubic-bezier(.2,.8,.2,1) 1.4s both}
.choose-char{pointer-events:auto;min-height:44px;padding:0 22px;border:0;border-radius:999px;background:rgba(255,250,240,.86);color:#3d4a33;font:800 13px/1 Manrope,system-ui,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:0 4px 12px rgba(43,42,36,.14),inset 0 0 0 1px rgba(153,128,67,.28);animation:sp-btn .6s cubic-bezier(.3,1.5,.5,1) 1.8s both}.choose-char[hidden]{display:none}.start-wrap{pointer-events:auto;animation:sp-btn .6s cubic-bezier(.3,1.5,.5,1) 1.6s both}.start{position:relative;overflow:hidden;display:inline-block;padding:20px 40px;border:0;border-radius:999px;background:linear-gradient(180deg,#f8d880,#e2b552 55%,#cf9c3c);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 7px 0 #9c7426,0 14px 24px rgba(0,0,0,.3);font:400 24px/1 'Lilita One';letter-spacing:.08em;color:#2b2a24;cursor:pointer;animation:sp-breathe 2.6s ease-in-out 2.4s infinite;transition:box-shadow .1s}.start:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 #9c7426,0 4px 8px rgba(0,0,0,.3)}.shine{position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:sp-shine 3.2s ease-in-out 2.2s infinite;pointer-events:none}
.settings-btn{position:absolute;right:28px;bottom:24px;border:0;background:transparent;font:600 11px/1 Manrope;letter-spacing:.2em;color:#fffaf0;opacity:.8;animation:sp-fade .8s ease 1.9s both;cursor:pointer;pointer-events:auto}.version{position:absolute;left:28px;bottom:24px;font:600 11px/1 Manrope;letter-spacing:.2em;color:#fffaf0;opacity:.55;animation:sp-fade .8s ease 1.9s both}
.splash{position:fixed;inset:0;z-index:20;transition:opacity .7s ease,visibility .7s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash iframe{width:100%;height:100%;border:0;display:block}
.settings{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(18,24,15,.36);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}.settings.open{opacity:1;visibility:visible}.settings-card{width:min(430px,100%);padding:28px;border:1px solid rgba(255,255,255,.56);border-radius:28px;background:rgba(242,238,226,.94);color:#2b3026;box-shadow:0 30px 90px rgba(15,21,13,.28)}.settings-card small{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#78806f}.settings-card h2{margin:7px 0 24px;font-size:34px;font-weight:800}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-top:1px solid rgba(55,65,49,.12)}.setting-copy b{display:block;font-size:13px}.setting-copy span{display:block;margin-top:3px;color:#767d70;font-size:10px;line-height:1.4}.toggle{position:relative;width:48px;height:28px;padding:0;border:0;border-radius:999px;background:#c9ccbf;cursor:pointer}.toggle:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);transition:transform .18s ease}.toggle.on{background:#586b4f}.toggle.on:after{transform:translateX(20px)}.close{width:100%;height:46px;margin-top:22px;border:0;border-radius:999px;background:#30392b;color:#f4f0e7;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
@media(max-width:720px){.logo-col{justify-content:space-between;gap:0;padding:8vh 0 72px}.logo-box{--k:.62}.tag{font-size:10px;letter-spacing:.24em}.start{padding:16px 32px;font-size:20px}.settings-btn{right:18px;bottom:18px}.version{left:18px;bottom:18px}}
@media(max-height:500px) and (orientation:landscape){.logo-col{justify-content:center;gap:6px;padding:0 0 2vh}.logo-box{--k:.46;height:138px}.actions{gap:12px}.tag{font-size:10px;letter-spacing:.24em}.start{padding:14px 30px;font-size:19px}.settings-btn{right:18px;bottom:14px}.version{left:18px;bottom:14px}}
@media(prefers-reduced-motion:reduce){.wind-layer span,.wind-layer i,.burst,.logo-bob,.growing,.wilds,.sprout,.sprout>span,.tag,.start-wrap,.start,.shine{animation:none!important}}
</style>
</head>

<script>
(()=>{document.getElementById('version').textContent='v'+window.TGW_VERSION.version;const MOTION='dymGame.entry.reduceMotion',scene=document.getElementById('scene'),ui=document.getElementById('ui'),splash=document.getElementById('splash'),splashFrame=document.getElementById('splash-frame');let leaving=false;const reduce=()=>{try{return localStorage.getItem(MOTION)==='1'}catch{return false}};function applyMotion(){const on=reduce();document.getElementById('motion-toggle').classList.toggle('on',on);document.getElementById('motion-toggle').setAttribute('aria-checked',String(on));document.body.classList.toggle('reduce',on);if(on)document.querySelectorAll('.wind-layer span,.wind-layer i').forEach(x=>x.style.animation='none')}addEventListener('message',e=>{if(e.source===splashFrame.contentWindow&&e.data?.type==='splash:done'){splash.classList.add('hide');setTimeout(()=>{try{splashFrame.src='about:blank'}catch{}},760)}});setTimeout(()=>splash.classList.add('hide'),5000);const last=(()=>{try{const v=JSON.parse(localStorage.getItem('tgw.lastChar')||'null');return v&&/^[a-z0-9_-]+$/.test(v.id)?v:null}catch{return null}})();   /* R121 Continue: last played character */
const go=url=>{if(leaving)return;leaving=true;try{scene.contentWindow.postMessage({t:'hop'},'*')}catch{}ui.style.animation='sp-leave .7s ease both';setTimeout(()=>location.href=url,760)};
const selectorUrl='./selector.html?embed=0&first=1&build='+encodeURIComponent(window.TGW_VERSION.build)+(last?'&char='+encodeURIComponent(last.id):'');
if(last){document.getElementById('start-label').textContent=('Continue as '+(last.name||last.id)).toUpperCase();const cc=document.getElementById('choose-char');cc.hidden=false;cc.textContent='Choose character';cc.title='Continue as '+(last.name||last.id);cc.onclick=()=>go(selectorUrl);document.getElementById('start').setAttribute('aria-label','Continue as '+(last.name||last.id));}
document.getElementById('start').onclick=()=>go(last?'./game.html?char='+encodeURIComponent(last.id):selectorUrl);const modal=document.getElementById('settings');document.getElementById('settings-open').onclick=()=>modal.classList.add('open');document.getElementById('settings-close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.getElementById('motion-toggle').onclick=()=>{try{localStorage.setItem(MOTION,reduce()?'0':'1')}catch{}location.reload()};const devT=document.getElementById('dev-toggle'),devOn=()=>{try{return localStorage.getItem('tgw.devMenu')==='1'}catch{return false}},syncDev=()=>{devT.classList.toggle('on',devOn());devT.setAttribute('aria-checked',String(devOn()))};devT.onclick=()=>{try{localStorage.setItem('tgw.devMenu',devOn()?'0':'1')}catch{}syncDev()};syncDev();applyMotion();addEventListener('keydown',e=>{if(e.key==='Enter'&&!leaving)document.getElementById('start').click();if(e.key==='Escape')modal.classList.remove('open')})})();
</script>
